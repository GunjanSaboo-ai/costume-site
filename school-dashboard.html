<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Dashboard - Costume Store</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f8f9fa; padding: 20px; }
        .container { max-width: 1600px; margin: 0 auto; }

        /* ===== HEADER ===== */
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .school-info {
            background: rgba(255,255,255,0.2);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 13px;
        }

        .logout-btn {
            background: rgba(255,255,255,0.2);
            color: white;
            padding: 6px 14px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 13px;
        }

        /* ===== CART (Small) ===== */
        .cart-btn {
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }

        .cart-btn:hover { background: rgba(255,255,255,0.3); }

        /* ===== FILTERS (Simple) ===== */
        .filters {
            background: white;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-input {
            padding: 8px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 13px;
            flex: 1;
            min-width: 120px;
        }

        .filter-input:focus { outline: none; border-color: #667eea; }

        .stats {
            font-size: 13px;
            color: #666;
            margin-left: auto;
        }
        .stats strong { color: #667eea; }

        /* ===== IMAGE GRID - SMALLER IMAGES ===== */
        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 12px;
        }

        .costume-card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .costume-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 16px rgba(0,0,0,0.12);
        }

        .image-container {
            width: 100%;
            height: 160px;
            background: #f0f0f0;
            overflow: hidden;
            position: relative;
        }

        .costume-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }

        .costume-card:hover .costume-image {
            transform: scale(1.03);
        }

        /* Stock badge - small */
        .stock-badge {
            position: absolute;
            top: 6px;
            right: 6px;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 9px;
            font-weight: bold;
            color: white;
        }
        .stock-available { background: rgba(76, 175, 80, 0.85); }
        .stock-limited { background: rgba(255, 152, 0, 0.85); }
        .stock-none { background: rgba(244, 67, 54, 0.85); }

        .costume-info {
            padding: 8px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .costume-name {
            font-weight: 600;
            font-size: 11px;
            color: #333;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .costume-design {
            font-size: 10px;
            color: #999;
        }

        .piece-count {
            font-size: 10px;
            color: #667eea;
            font-weight: 600;
            background: #eef0ff;
            padding: 2px 8px;
            border-radius: 10px;
        }

        /* ===== PAGINATION ===== */
        .pagination {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .page-btn {
            padding: 6px 12px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }

        .page-btn.active { background: #667eea; color: white; border-color: #667eea; }
        .page-btn:hover:not(.active) { background: #f0f0f0; }

        /* ===== MODAL ===== */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(4px);
        }

        .modal.active { display: flex; }

        .modal-content {
            background: white;
            max-width: 500px;
            width: 90%;
            border-radius: 16px;
            padding: 20px;
            max-height: 85vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .modal-header h3 {
            font-size: 18px;
            color: #333;
        }

        .modal-close {
            font-size: 28px;
            cursor: pointer;
            background: none;
            border: none;
            color: #999;
        }

        .modal-close:hover { color: #333; }

        .modal-image {
            width: 100%;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .modal-detail-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid #f0f0f0;
            font-size: 13px;
        }

        .modal-detail-row .label { color: #888; }
        .modal-detail-row .value { font-weight: 500; }

        .modal-size-btn {
            background: #f0f0f0;
            border: 1px solid #ddd;
            padding: 4px 10px;
            border-radius: 5px;
            font-size: 12px;
            cursor: pointer;
            margin: 3px;
        }

        .modal-size-btn:hover { background: #667eea; color: white; }

        .modal-add-btn {
            background: #4caf50;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
            width: 100%;
        }

        .modal-add-btn:hover { background: #43a047; }

        .modal-location {
            font-size: 12px;
            color: #555;
            background: #f0f7ff;
            padding: 4px 8px;
            border-radius: 4px;
            margin-top: 4px;
        }

        /* ===== CART PANEL ===== */
        .cart-panel {
            position: fixed;
            right: 0;
            top: 0;
            width: 320px;
            background: white;
            height: 100vh;
            box-shadow: -4px 0 20px rgba(0,0,0,0.1);
            z-index: 200;
            transform: translateX(100%);
            transition: transform 0.3s ease;
            overflow-y: auto;
        }

        .cart-panel.open { transform: translateX(0); }

        .cart-header {
            background: #667eea;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
        }

        .cart-close {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
        }

        .cart-items { padding: 15px; }
        .cart-item {
            border-bottom: 1px solid #eee;
            padding: 10px 0;
            font-size: 13px;
        }

        .cart-item-details {
            display: flex;
            justify-content: space-between;
        }

        .cart-summary {
            padding: 15px;
            border-top: 2px solid #eee;
            background: #f8f9fa;
            position: sticky;
            bottom: 0;
        }

        .cart-order-btn {
            width: 100%;
            padding: 10px;
            background: #4caf50;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .cart-order-btn:hover { background: #43a047; }

        .cart-clear-btn {
            width: 100%;
            padding: 8px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 5px;
        }

        /* ===== OVERLAY ===== */
        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.4);
            z-index: 150;
        }

        .overlay.active { display: block; }

        .loading {
            text-align: center;
            padding: 30px;
            color: #999;
        }

        .no-results {
            text-align: center;
            padding: 30px;
            color: #999;
        }

        @media (max-width: 768px) {
            .image-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
            .image-container { height: 120px; }
            .cart-panel { width: 100%; }
            .header { padding: 12px 16px; }
            .filters { flex-direction: column; }
            .stats { margin-left: 0; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div>
                <h1 style="font-size: 20px;">🎭 Costume Store</h1>
            </div>
            <div style="display: flex; align-items: center; gap: 12px;">
                <span class="school-info">🏫 <span id="schoolName"></span></span>
                <button class="cart-btn" onclick="toggleCart()">🛒 <span id="cartCount">0</span></button>
                <a href="logout.html" class="logout-btn">🚪 Logout</a>
            </div>
        </div>

        <!-- Filters -->
        <div class="filters">
            <input type="text" class="filter-input" id="searchInput" placeholder="🔍 Search by design number...">
            <select class="filter-input" id="typeFilter"><option value="all">All Types</option></select>
            <span class="stats">📦 <strong id="totalDesigns">0</strong> designs</span>
        </div>

        <!-- Image Grid -->
        <div class="image-grid" id="imageGrid">
            <div class="loading">Loading costumes...</div>
        </div>

        <!-- Pagination -->
        <div class="pagination" id="pagination"></div>
    </div>

    <!-- Detail Modal -->
    <div id="detailModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Costume Details</h3>
                <button class="modal-close" onclick="closeDetailModal()">&times;</button>
            </div>
            <div id="modalBody"></div>
        </div>
    </div>

    <!-- Cart Panel -->
    <div class="overlay" id="cartOverlay" onclick="toggleCart()"></div>
    <div class="cart-panel" id="cartPanel">
        <div class="cart-header">
            <span>🛒 My Order</span>
            <button class="cart-close" onclick="toggleCart()">×</button>
        </div>
        <div class="cart-items" id="cartItems">
            <div style="text-align: center; color: #999; padding: 20px;">Your cart is empty</div>
        </div>
        <div class="cart-summary">
            <div><strong>Total Items:</strong> <span id="totalItems">0</span></div>
            <button class="cart-order-btn" onclick="placeOrder()">📧 Send Order</button>
            <button class="cart-clear-btn" onclick="clearCart()">🗑️ Clear Cart</button>
        </div>
    </div>

    <script>
        // ==================== CHECK LOGIN ====================
        if (!sessionStorage.getItem('loggedIn')) {
            window.location.href = 'login.html';
        }
        document.getElementById('schoolName').textContent = sessionStorage.getItem('schoolName') || 'School';

        // ==================== CONFIG ====================
        const SUPABASE_URL = 'https://vpvewqyfbtqpckcjlxsg.supabase.co';
        const BUCKET_NAME = 'costume-images';
        const itemsPerPage = 30;
        let currentPage = 1;
        let inventoryData = [];
        let cart = JSON.parse(sessionStorage.getItem('schoolCart') || '[]');
        let locationMaster = {};

        function getImageUrl(designNo) {
            return `${SUPABASE_URL}/storage/v1/object/public/${BUCKET_NAME}/${designNo}.jpg`;
        }

        // ==================== LOAD LOCATION MASTER ====================
        async function loadLocationMaster() {
            try {
                const response = await fetch('/api/locations');
                const result = await response.json();
                if (result.success) locationMaster = result.locations;
            } catch (err) {}
        }

        function getLocationDisplay(locCode) {
            if (!locCode) return 'No location';
            const loc = locationMaster[String(locCode).trim()];
            if (loc) return loc.display || `Rack ${loc.rack}, Shelf ${loc.shelf}, Position ${loc.position}`;
            return 'Location not mapped';
        }

        // ==================== LOAD INVENTORY ====================
        function loadInventory() {
            const saved = localStorage.getItem('inventoryData');
            if (!saved) {
                document.getElementById('imageGrid').innerHTML = '<div class="no-results">⚠️ No inventory loaded.</div>';
                return;
            }
            inventoryData = JSON.parse(saved);
            inventoryData.sort((a, b) => a.designNo.localeCompare(b.designNo));
            populateFilters();
            displayCostumes();
            updateStats();
            updateCartDisplay();
        }

        function populateFilters() {
            const types = new Set();
            inventoryData.forEach(item => { if (item.garmentType) types.add(item.garmentType); });
            const typeFilter = document.getElementById('typeFilter');
            typeFilter.innerHTML = '<option value="all">All Types</option>';
            Array.from(types).sort().forEach(type => {
                typeFilter.innerHTML += `<option value="${type}">${type}</option>`;
            });
        }

        function updateStats() {
            document.getElementById('totalDesigns').textContent = inventoryData.length;
        }

        function getFilteredData() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const type = document.getElementById('typeFilter').value;
            return inventoryData.filter(item => {
                const matchSearch = item.designNo.toLowerCase().includes(search) || 
                                   (item.productName || '').toLowerCase().includes(search);
                const matchType = type === 'all' || item.garmentType === type;
                return matchSearch && matchType;
            });
        }

        // ==================== DISPLAY ====================
        function displayCostumes() {
            const filtered = getFilteredData();
            const totalPages = Math.ceil(filtered.length / itemsPerPage);
            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const pageItems = filtered.slice(start, end);
            const grid = document.getElementById('imageGrid');

            if (pageItems.length === 0) {
                grid.innerHTML = '<div class="no-results">No costumes found.</div>';
                document.getElementById('pagination').innerHTML = '';
                return;
            }

            grid.innerHTML = pageItems.map(item => {
                const totalPieces = item.totalPieces || Object.values(item.sizes || {}).reduce((a, b) => a + b, 0);
                let stockClass = 'stock-available';
                let stockText = 'In Stock';
                if (totalPieces === 0) { stockClass = 'stock-none'; stockText = 'Out'; }
                else if (totalPieces <= 2) { stockClass = 'stock-limited'; stockText = 'Low'; }

                return `
                    <div class="costume-card" onclick="showDetails('${item.designNo}')">
                        <div class="image-container">
                            <img class="costume-image" 
                                 src="${getImageUrl(item.designNo)}" 
                                 alt="${item.productName || item.designNo}"
                                 loading="lazy"
                                 onerror="this.style.display='none'">
                            <div class="stock-badge ${stockClass}">${stockText}</div>
                        </div>
                        <div class="costume-info">
                            <span class="costume-name">${item.productName || 'Design ' + item.designNo}</span>
                            <span class="piece-count">${totalPieces}</span>
                        </div>
                    </div>
                `;
            }).join('');

            displayPagination(totalPages);
        }

        function displayPagination(totalPages) {
            const div = document.getElementById('pagination');
            if (totalPages <= 1) { div.innerHTML = ''; return; }
            let html = '';
            if (currentPage > 1) html += `<button class="page-btn" onclick="goToPage(${currentPage - 1})">←</button>`;
            for (let i = 1; i <= Math.min(totalPages, 5); i++) {
                html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
            }
            if (currentPage < totalPages) html += `<button class="page-btn" onclick="goToPage(${currentPage + 1})">→</button>`;
            div.innerHTML = html;
        }

        function goToPage(page) {
            currentPage = page;
            displayCostumes();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ==================== DETAILS MODAL ====================
        function showDetails(designNo) {
            const design = inventoryData.find(d => d.designNo === designNo);
            if (!design) return;

            const imageUrl = getImageUrl(design.designNo);
            const sizes = design.sizes || {};
            const totalPieces = design.totalPieces || Object.values(sizes).reduce((a, b) => a + b, 0);

            // Build size buttons
            let sizeHtml = '';
            for (const [size, qty] of Object.entries(sizes)) {
                sizeHtml += `<button class="modal-size-btn" onclick="addToCart('${design.designNo}', '${size}', ${qty})">${size} (${qty})</button>`;
            }

            // Build location info
            let locationHtml = '';
            if (design.items && design.items.length > 0) {
                const locs = design.items.map(item => getLocationDisplay(item.locCode)).filter(l => l);
                if (locs.length > 0) {
                    locationHtml = `<div class="modal-location">📍 ${locs[0]}</div>`;
                }
            }

            document.getElementById('modalTitle').textContent = design.productName || 'Design ' + design.designNo;
            document.getElementById('modalBody').innerHTML = `
                <img class="modal-image" src="${imageUrl}" onerror="this.style.display='none'">
                <div class="modal-detail-row"><span class="label">Design #</span><span class="value">${design.designNo}</span></div>
                <div class="modal-detail-row"><span class="label">Color</span><span class="value">${design.color || 'Various'}</span></div>
                <div class="modal-detail-row"><span class="label">Type</span><span class="value">${design.garmentType || 'Costume'}</span></div>
                <div class="modal-detail-row"><span class="label">Total Pieces</span><span class="value">${totalPieces}</span></div>
                ${locationHtml}
                <div style="margin-top: 12px;">
                    <strong>Sizes:</strong>
                    <div style="margin-top: 6px;">${sizeHtml || 'No sizes available'}</div>
                </div>
            `;

            document.getElementById('detailModal').classList.add('active');
        }

        function closeDetailModal() {
            document.getElementById('detailModal').classList.remove('active');
        }

        // ==================== CART ====================
        function toggleCart() {
            document.getElementById('cartPanel').classList.toggle('open');
            document.getElementById('cartOverlay').classList.toggle('active');
        }

        function addToCart(designNo, size, availableQty) {
            const design = inventoryData.find(d => d.designNo === designNo);
            if (!design) return;
            if (availableQty <= 0) { alert('Out of stock'); return; }

            const qty = parseInt(prompt(`Enter quantity for ${design.productName}\nSize: ${size}\nAvailable: ${availableQty}`, '1'));
            if (isNaN(qty) || qty < 1) return;
            if (qty > availableQty) { alert(`Only ${availableQty} available`); return; }

            const existing = cart.find(item => item.designNo === designNo && item.size === size);
            if (existing) {
                if (existing.quantity + qty > availableQty) {
                    alert(`Only ${availableQty - existing.quantity} remaining`);
                    return;
                }
                existing.quantity += qty;
            } else {
                cart.push({ designNo, name: design.productName || designNo, size, quantity: qty });
            }

            sessionStorage.setItem('schoolCart', JSON.stringify(cart));
            updateCartDisplay();
            alert(`✓ Added ${qty}x ${design.productName} (Size ${size})`);
        }

        function updateCartDisplay() {
            const totalItems = cart.reduce((s, i) => s + i.quantity, 0);
            document.getElementById('cartCount').textContent = totalItems;
            document.getElementById('totalItems').textContent = totalItems;

            const itemsDiv = document.getElementById('cartItems');
            if (cart.length === 0) {
                itemsDiv.innerHTML = '<div style="text-align:center;color:#999;padding:20px;">Your cart is empty</div>';
                return;
            }

            itemsDiv.innerHTML = cart.map((item, i) => `
                <div class="cart-item">
                    <div class="cart-item-details">
                        <strong>${item.name.substring(0, 25)}</strong>
                        <span>${item.quantity}</span>
                    </div>
                    <div style="font-size:11px;color:#888;">Size: ${item.size}</div>
                    <button onclick="removeFromCart(${i})" style="background:#dc3545;color:white;border:none;padding:2px 8px;border-radius:4px;font-size:11px;margin-top:4px;">Remove</button>
                </div>
            `).join('');
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            sessionStorage.setItem('schoolCart', JSON.stringify(cart));
            updateCartDisplay();
        }

        function clearCart() {
            if (!confirm('Clear all items?')) return;
            cart = [];
            sessionStorage.setItem('schoolCart', JSON.stringify(cart));
            updateCartDisplay();
        }

        function placeOrder() {
            if (cart.length === 0) { alert('Cart is empty'); return; }
            const schoolName = sessionStorage.getItem('schoolName');
            const schoolEmail = sessionStorage.getItem('schoolEmail');
            let summary = `ORDER from ${schoolName}\nEmail: ${schoolEmail}\nDate: ${new Date().toLocaleString()}\n\nITEMS:\n`;
            cart.forEach(item => {
                summary += `${item.name} (${item.designNo}) - Size ${item.size} x${item.quantity}\n`;
            });
            const orderId = 'ORD-' + Date.now();
            const orders = JSON.parse(localStorage.getItem('allOrders') || '[]');
            orders.push({ orderId, schoolName, schoolEmail, date: new Date().toISOString(), items: cart, totalItems: cart.reduce((s, i) => s + i.quantity, 0), status: 'pending' });
            localStorage.setItem('allOrders', JSON.stringify(orders));
            const subject = encodeURIComponent(`Order from ${schoolName}`);
            window.location.href = `mailto:orders@costumestore.com?subject=${subject}&body=${encodeURIComponent(summary)}`;
            cart = [];
            sessionStorage.setItem('schoolCart', JSON.stringify(cart));
            updateCartDisplay();
            alert('Order sent!');
            toggleCart();
        }

        // ==================== EVENTS ====================
        document.getElementById('searchInput').addEventListener('input', () => { currentPage = 1; displayCostumes(); });
        document.getElementById('typeFilter').addEventListener('change', () => { currentPage = 1; displayCostumes(); });
        document.getElementById('detailModal').addEventListener('click', function(e) { if (e.target === this) closeDetailModal(); });

        // ==================== GLOBALS ====================
        window.goToPage = goToPage;
        window.showDetails = showDetails;
        window.closeDetailModal = closeDetailModal;
        window.addToCart = addToCart;
        window.removeFromCart = removeFromCart;
        window.clearCart = clearCart;
        window.placeOrder = placeOrder;
        window.toggleCart = toggleCart;

        // ==================== INIT ====================
        loadLocationMaster();
        loadInventory();
        updateCartDisplay();
    </script>
</body>
</html>
