<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Dashboard - Costume Store</title>
    <style>
        /* ... your existing CSS ... */
    </style>
</head>
<body>
    <!-- ... your existing HTML ... -->

    <script>
        // ==================== SUPABASE CONFIG ====================
        const SUPABASE_URL = 'https://vpvewqyfbtqpckcjlxsg.supabase.co';
        const BUCKET_NAME = 'costume-images';
        
        // ✅ Direct image URL - NO caching needed!
        function getImageUrl(designNo) {
            return `${SUPABASE_URL}/storage/v1/object/public/${BUCKET_NAME}/${designNo}.jpg`;
        }

        // ==================== LOAD INVENTORY ====================
        function loadInventory() {
            const saved = localStorage.getItem('inventoryData');
            if (!saved) {
                document.getElementById('imageGrid').innerHTML = '<div class="no-results">⚠️ No inventory loaded.</div>';
                return;
            }

            const allData = JSON.parse(saved);
            inventoryData = allData;
            inventoryData.sort((a, b) => a.designNo.localeCompare(b.designNo));
            
            populateFilters();
            displayCostumes();
            updateStats();
            updateCartDisplay();
        }

        // ==================== DISPLAY COSTUMES ====================
        function displayCostumes() {
            const filtered = getFilteredData();
            const totalPages = Math.ceil(filtered.length / itemsPerPage);
            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const pageItems = filtered.slice(start, end);
            
            const grid = document.getElementById('imageGrid');
            
            if (pageItems.length === 0) {
                grid.innerHTML = '<div class="no-results">No costumes found.</div>';
                document.getElementById('pagination').innerHTML = '';
                return;
            }
            
            grid.innerHTML = pageItems.map(item => {
                const sizeList = Object.entries(item.sizes);
                // ✅ Direct Supabase URL - no cache, no placeholders
                const imageUrl = getImageUrl(item.designNo);
                
                return `
                    <div class="costume-card" onclick="showDetails('${item.designNo}')">
                        <div class="image-container">
                            <img class="costume-image" 
                                 src="${imageUrl}" 
                                 alt="${item.productName}"
                                 loading="lazy">
                            <div class="stock-overlay stock-available">In Stock</div>
                        </div>
                        <div class="costume-info">
                            <div class="costume-name">${item.productName.substring(0, 35)}</div>
                            <div class="costume-design">🔖 Design #: ${item.designNo}</div>
                            <div class="costume-design">🎨 ${item.color || 'Various'} | 👗 ${item.garmentType || 'Costume'}</div>
                            <div class="size-buttons">
                                ${sizeList.map(([size, qty]) => `
                                    <button class="size-btn" onclick="event.stopPropagation(); addToCart('${item.designNo}', '${size}', ${qty})">
                                        ${size} (${qty})
                                    </button>
                                `).join('')}
                            </div>
                            <div style="font-size: 11px; color: #888; margin-top: 5px;">
                                📦 ${item.totalPieces} piece${item.totalPieces !== 1 ? 's' : ''} available
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
            
            displayPagination(totalPages);
        }

        // ==================== DETAILS MODAL ====================
        function showDetails(designNo) {
            const design = inventoryData.find(d => d.designNo === designNo);
            if (!design) return;
            
            const imageUrl = getImageUrl(design.designNo);
            
            // ... rest of the code
        }

        // ==================== INITIALIZE ====================
        loadInventory();
    </script>
</body>
</html>
