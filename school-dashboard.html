<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f8f9fa; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; }
        
        .header {
            background: #667eea;
            color: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }
        
        .costume-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            cursor: pointer;
        }
        
        .costume-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }
        
        .costume-info {
            padding: 12px;
        }
        
        .costume-name {
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 30px;
        }
        
        .page-btn {
            padding: 8px 12px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 6px;
            cursor: pointer;
        }
        
        .page-btn.active {
            background: #667eea;
            color: white;
        }
        
        .no-results {
            text-align: center;
            padding: 50px;
            color: #666;
        }
        
        .loading {
            text-align: center;
            padding: 50px;
            color: #666;
        }

        .logout-btn {
            color: white;
            text-decoration: none;
            background: rgba(255,255,255,0.2);
            padding: 8px 16px;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎭 Costume Store</h1>
            <div>
                <span id="schoolNameDisplay"></span>
                <a href="logout.html" class="logout-btn">🚪 Logout</a>
            </div>
        </div>

        <div class="image-grid" id="imageGrid">
            <div class="loading">Loading costumes...</div>
        </div>

        <div class="pagination" id="pagination"></div>
    </div>

    <script>
        // ==================== CHECK LOGIN ====================
        if (!sessionStorage.getItem('loggedIn')) {
            window.location.href = 'login.html';
        }

        // ==================== CONFIG ====================
        const SUPABASE_URL = 'https://vpvewqyfbtqpckcjlxsg.supabase.co';
        const BUCKET_NAME = 'costume-images';
        const itemsPerPage = 20;
        let currentPage = 1;
        let inventoryData = [];

        // ==================== SET SCHOOL NAME ====================
        const schoolNameDisplay = document.getElementById('schoolNameDisplay');
        if (schoolNameDisplay) {
            schoolNameDisplay.textContent = '🏫 ' + (sessionStorage.getItem('schoolName') || 'School');
        }

        // ==================== GET IMAGE URL ====================
        function getImageUrl(designNo) {
            return `${SUPABASE_URL}/storage/v1/object/public/${BUCKET_NAME}/${designNo}.jpg`;
        }

        // ==================== LOAD INVENTORY ====================
        function loadInventory() {
            const saved = localStorage.getItem('inventoryData');
            
            if (!saved) {
                document.getElementById('imageGrid').innerHTML = '<div class="no-results">⚠️ No inventory loaded. Please contact admin.</div>';
                return;
            }

            try {
                const allData = JSON.parse(saved);
                inventoryData = allData;
                inventoryData.sort((a, b) => a.designNo.localeCompare(b.designNo));
                
                console.log('✅ Loaded', inventoryData.length, 'designs');
                displayCostumes();
            } catch (err) {
                console.error('Error:', err);
                document.getElementById('imageGrid').innerHTML = '<div class="no-results">⚠️ Error loading inventory.</div>';
            }
        }

        // ==================== DISPLAY COSTUMES ====================
        function displayCostumes() {
            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const pageItems = inventoryData.slice(start, end);
            
            const grid = document.getElementById('imageGrid');
            
            if (pageItems.length === 0) {
                grid.innerHTML = '<div class="no-results">No costumes found.</div>';
                document.getElementById('pagination').innerHTML = '';
                return;
            }
            
            grid.innerHTML = pageItems.map(item => {
                const imageUrl = getImageUrl(item.designNo);
                const sizeList = Object.entries(item.sizes || {});
                
                return `
                    <div class="costume-card" onclick="showDetails('${item.designNo}')">
                        <img src="${imageUrl}" alt="${item.productName}" loading="lazy">
                        <div class="costume-info">
                            <div class="costume-name">${item.productName || 'Design ' + item.designNo}</div>
                            <div style="font-size:12px; color:#888;">🔖 ${item.designNo}</div>
                            <div style="font-size:12px; color:#888;">📦 ${item.totalPieces} pieces</div>
                            <div style="font-size:12px; color:#888; margin-top:5px;">
                                ${sizeList.map(([size, qty]) => `${size}:${qty}`).join(' | ')}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
            
            displayPagination();
        }

        // ==================== SHOW DETAILS ====================
        function showDetails(designNo) {
            const design = inventoryData.find(d => d.designNo === designNo);
            if (!design) return;
            
            const sizeList = Object.entries(design.sizes || {});
            const sizeText = sizeList.map(([size, qty]) => `Size ${size}: ${qty} pieces`).join('\n');
            
            alert(
                `📋 COSTUME DETAILS\n━━━━━━━━━━━━━━━━━━━━\n` +
                `Design #: ${design.designNo}\n` +
                `Name: ${design.productName || 'N/A'}\n` +
                `Color: ${design.color || 'Various'}\n` +
                `Type: ${design.garmentType || 'Costume'}\n` +
                `Total Pieces: ${design.totalPieces}\n` +
                `━━━━━━━━━━━━━━━━━━━━\n` +
                `Sizes Available:\n${sizeText}`
            );
        }

        // ==================== PAGINATION ====================
        function displayPagination() {
            const totalPages = Math.ceil(inventoryData.length / itemsPerPage);
            const paginationDiv = document.getElementById('pagination');
            
            if (totalPages <= 1) {
                paginationDiv.innerHTML = '';
                return;
            }
            
            let html = '';
            if (currentPage > 1) {
                html += `<button class="page-btn" onclick="goToPage(${currentPage - 1})">← Prev</button>`;
            }
            
            for (let i = 1; i <= Math.min(totalPages, 5); i++) {
                html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
            }
            
            if (currentPage < totalPages) {
                html += `<button class="page-btn" onclick="goToPage(${currentPage + 1})">Next →</button>`;
            }
            
            paginationDiv.innerHTML = html;
        }

        function goToPage(page) {
            currentPage = page;
            displayCostumes();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ==================== INITIALIZE ====================
        loadInventory();
    </script>
</body>
</html>
