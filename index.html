<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎭 Premium Costume Store</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 20px;
            padding: 40px 30px;
            margin-bottom: 30px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
        }

        .header h1 {
            color: #667eea;
            font-size: 2.8rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .header h1 span {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            color: #888;
            font-size: 1.1rem;
        }

        .login-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: white;
            color: #667eea;
            padding: 12px 24px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(0,0,0,0.12);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }

        .featured-section {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        .featured-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .featured-header h2 {
            color: #333;
            font-size: 1.6rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .featured-header .badge {
            background: #ff9800;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .refresh-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.3s;
        }

        .refresh-btn:hover {
            background: #5a67d8;
            transform: scale(1.02);
        }

        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .image-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
            transition: all 0.3s ease;
            cursor: pointer;
            border: 1px solid #f0f0f0;
        }

        .image-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 35px rgba(0,0,0,0.15);
        }

        .image-container {
            width: 100%;
            height: 260px;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .image-card:hover .image-container img {
            transform: scale(1.05);
        }

        .featured-ribbon {
            position: absolute;
            top: 12px;
            left: -30px;
            background: #ff9800;
            color: white;
            padding: 4px 30px;
            font-size: 11px;
            font-weight: 600;
            transform: rotate(-45deg);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .image-info {
            padding: 16px 18px;
        }

        .image-name {
            font-weight: 600;
            color: #333;
            font-size: 1rem;
            margin-bottom: 4px;
        }

        .image-design {
            color: #999;
            font-size: 13px;
        }

        .featured-badge {
            display: inline-block;
            background: #fff3e0;
            color: #ff9800;
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            margin-top: 8px;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #999;
            font-size: 1.1rem;
        }

        .loading .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f0f0f0;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .no-featured {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .no-featured .emoji {
            font-size: 48px;
            display: block;
            margin-bottom: 15px;
        }

        .footer {
            text-align: center;
            padding: 30px 20px 10px;
            color: rgba(255,255,255,0.7);
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8rem;
            }
            .login-btn {
                top: 10px;
                right: 10px;
                padding: 8px 16px;
                font-size: 12px;
            }
            .image-grid {
                grid-template-columns: 1fr;
            }
            .image-container {
                height: 220px;
            }
            .featured-header {
                flex-direction: column;
                text-align: center;
            }
        }

        @media (max-width: 480px) {
            body { padding: 10px; }
            .header { padding: 25px 15px; }
            .header h1 { font-size: 1.5rem; }
            .featured-section { padding: 18px; }
            .image-container { height: 180px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="login.html" class="login-btn">🏫 School Login</a>

        <div class="header">
            <h1>🎭 <span>Premium Costume Store</span></h1>
            <p>Exclusive costumes for schools, events, and performances</p>
        </div>

        <div class="featured-section">
            <div class="featured-header">
                <h2>
                    ✨ Featured Collection
                    <span class="badge">⭐ Trending</span>
                </h2>
                <button class="refresh-btn" onclick="loadFeatured()">🔄 Refresh</button>
            </div>

            <div class="image-grid" id="imageGrid">
                <div class="loading">
                    <div class="spinner"></div>
                    Loading featured costumes...
                </div>
            </div>
        </div>

        <div class="footer">
            <p>© 2024 Premium Costume Store. All rights reserved.</p>
        </div>
    </div>

    <script>
        // ============================================================
        // LOAD FEATURED DESIGNS - NO FLICKERING VERSION
        // ============================================================
        function loadFeatured() {
            const grid = document.getElementById('imageGrid');

            // Get featured designs from localStorage
            let featuredDesigns = [];
            const savedFeatured = localStorage.getItem('featuredDesigns');
            if (savedFeatured) {
                try {
                    featuredDesigns = JSON.parse(savedFeatured);
                } catch(e) {
                    featuredDesigns = ["10017", "10001", "10002", "10013", "10015", "10016"];
                }
            } else {
                featuredDesigns = ["10017", "10001", "10002", "10013", "10015", "10016"];
                localStorage.setItem('featuredDesigns', JSON.stringify(featuredDesigns));
            }

            // If no featured designs
            if (featuredDesigns.length === 0) {
                grid.innerHTML = `
                    <div class="no-featured">
                        <span class="emoji">✨</span>
                        No featured costumes selected yet.<br>
                        <small style="color: #bbb;">Login as Admin to select featured costumes.</small>
                    </div>
                `;
                return;
            }

            // Build the grid DIRECTLY - NO image checking to prevent flickering
            let html = '';
            let featuredCount = 0;

            featuredDesigns.forEach(designNo => {
                const thumbPath = `/images/thumbs/${designNo}.jpg`;
                const fullPath = `/images/${designNo}.jpg`;
                const placeholder = `https://via.placeholder.com/300x260?text=📸+${designNo}`;

                html += `
                    <div class="image-card" onclick="showMessage('${designNo}')">
                        <div class="image-container">
                            <img 
                                src="${thumbPath}" 
                                alt="Design ${designNo}"
                                loading="lazy"
                                onerror="this.onerror=null; this.src='${fullPath}'; this.onerror=function(){this.src='${placeholder}'}">
                            <div class="featured-ribbon">Featured</div>
                        </div>
                        <div class="image-info">
                            <div class="image-name">Design #${designNo}</div>
                            <div class="image-design">🔖 Premium Costume</div>
                            <div class="featured-badge">⭐ Featured</div>
                        </div>
                    </div>
                `;
                featuredCount++;
            });

            grid.innerHTML = html;
        }

        // ============================================================
        // SHOW MESSAGE ON CLICK
        // ============================================================
        function showMessage(designNo) {
            alert(
                `✨ Design #${designNo}\n\n` +
                `🏫 Please login with your school account to:\n` +
                `  • View full details\n` +
                `  • Check availability\n` +
                `  • Place orders\n\n` +
                `Click "School Login" at the top right to access the complete catalog.`
            );
        }

        // ============================================================
        // MAKE FUNCTIONS GLOBAL
        // ============================================================
        window.loadFeatured = loadFeatured;
        window.showMessage = showMessage;

        // ============================================================
        // INITIALIZE
        // ============================================================
        loadFeatured();
    </script>
</body>
</html>
