<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎭 Premium Costume Store</title>
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* ===== HEADER ===== */
        .header {
            background: white;
            border-radius: 20px;
            padding: 40px 30px;
            margin-bottom: 30px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            position: relative;
        }

        .header h1 {
            color: #667eea;
            font-size: 2.8rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .header h1 span {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            color: #888;
            font-size: 1.1rem;
        }

        /* ===== LOGIN BUTTON ===== */
        .login-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: white;
            color: #667eea;
            padding: 12px 24px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(0,0,0,0.12);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }

        /* ===== FEATURED SECTION ===== */
        .featured-section {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        .featured-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .featured-header h2 {
            color: #333;
            font-size: 1.6rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .featured-header .badge {
            background: #ff9800;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .refresh-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.3s;
        }

        .refresh-btn:hover {
            background: #5a67d8;
            transform: scale(1.02);
        }

        /* ===== IMAGE GRID ===== */
        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .image-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
            transition: all 0.3s ease;
            cursor: pointer;
            border: 1px solid #f0f0f0;
        }

        .image-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 35px rgba(0,0,0,0.15);
        }

        .image-container {
            width: 100%;
            height: 260px;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .image-card:hover .image-container img {
            transform: scale(1.05);
        }

        .featured-ribbon {
            position: absolute;
            top: 12px;
            left: -30px;
            background: #ff9800;
            color: white;
            padding: 4px 30px;
            font-size: 11px;
            font-weight: 600;
            transform: rotate(-45deg);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .image-info {
            padding: 16px 18px;
        }

        .image-name {
            font-weight: 600;
            color: #333;
            font-size: 1rem;
            margin-bottom: 4px;
        }

        .image-design {
            color: #999;
            font-size: 13px;
        }

        .featured-badge {
            display: inline-block;
            background: #fff3e0;
            color: #ff9800;
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            margin-top: 8px;
        }

        /* ===== LOADING & EMPTY STATES ===== */
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #999;
            font-size: 1.1rem;
        }

        .loading .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f0f0f0;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .no-featured {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .no-featured .emoji {
            font-size: 48px;
            display: block;
            margin-bottom: 15px;
        }

        /* ===== FOOTER ===== */
        .footer {
            text-align: center;
            padding: 30px 20px 10px;
            color: rgba(255,255,255,0.7);
            font-size: 14px;
        }

        .footer a {
            color: rgba(255,255,255,0.9);
            text-decoration: none;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8rem;
            }

            .header p {
                font-size: 0.95rem;
            }

            .login-btn {
                top: 10px;
                right: 10px;
                padding: 8px 16px;
                font-size: 12px;
            }

            .image-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .image-container {
                height: 220px;
            }

            .featured-header {
                flex-direction: column;
                text-align: center;
            }

            .featured-header h2 {
                font-size: 1.3rem;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            .header {
                padding: 25px 15px;
            }

            .header h1 {
                font-size: 1.5rem;
            }

            .featured-section {
                padding: 18px;
            }

            .image-container {
                height: 180px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- School Login Button -->
        <a href="login.html" class="login-btn">
            🏫 School Login
        </a>

        <!-- Header -->
        <div class="header">
            <h1>🎭 <span>Premium Costume Store</span></h1>
            <p>Exclusive costumes for schools, events, and performances</p>
        </div>

        <!-- Featured Section -->
        <div class="featured-section">
            <div class="featured-header">
                <h2>
                    ✨ Featured Collection
                    <span class="badge">⭐ Trending</span>
                </h2>
                <button class="refresh-btn" onclick="loadFeatured()">🔄 Refresh</button>
            </div>

            <div class="image-grid" id="imageGrid">
                <div class="loading">
                    <div class="spinner"></div>
                    Loading featured costumes...
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <p>© 2024 Premium Costume Store. All rights reserved.</p>
        </div>
    </div>

    <script>
        // ============================================================
        // LOAD FEATURED DESIGNS
        // ============================================================
        let featuredDesigns = [];
        let inventoryData = [];

        function loadFeatured() {
            const grid = document.getElementById('imageGrid');

            // Show loading
            grid.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    Loading featured costumes...
                </div>
            `;

            // Get featured designs from localStorage
            const savedFeatured = localStorage.getItem('featuredDesigns');
            if (savedFeatured) {
                featuredDesigns = JSON.parse(savedFeatured);
            } else {
                // Default featured - change these to your actual design numbers
                featuredDesigns = ["10017", "10001", "10002", "10013", "10015", "10016"];
                localStorage.setItem('featuredDesigns', JSON.stringify(featuredDesigns));
            }

            // Get inventory data for product names
            const savedInventory = localStorage.getItem('inventoryData');
            if (savedInventory) {
                inventoryData = JSON.parse(savedInventory);
            }

            // If no featured designs
            if (featuredDesigns.length === 0) {
                grid.innerHTML = `
                    <div class="no-featured">
                        <span class="emoji">✨</span>
                        No featured costumes selected yet.<br>
                        <small style="color: #bbb;">Login as Admin to select featured costumes.</small>
                    </div>
                `;
                return;
            }

            // Build the grid
            let html = '';
            let found = 0;

            featuredDesigns.forEach(designNo => {
                // Find design in inventory
                const design = inventoryData.find(d => d.designNo === designNo);
                const productName = design ? design.productName : `Design ${designNo}`;
                const thumbPath = `images/thumbs/${designNo}.jpg`;
                const fullPath = `images/${designNo}.jpg`;

                // Check if image exists
                const img = new Image();
                img.onload = function() {
                    // Image exists - display it
                    found++;
                    const cardHtml = `
                        <div class="image-card" onclick="showMessage('${designNo}')">
                            <div class="image-container">
                                <img src="${thumbPath}" 
                                     alt="${productName}"
                                     onerror="this.onerror=null; this.src='${fullPath}'; this.onerror=function(){this.src='https://via.placeholder.com/300x260?text=📸+${designNo}'}">
                                <div class="featured-ribbon">Featured</div>
                            </div>
                            <div class="image-info">
                                <div class="image-name">${productName}</div>
                                <div class="image-design">🔖 Design #${designNo}</div>
                                <div class="featured-badge">⭐ Featured</div>
                            </div>
                        </div>
                    `;
                    // Append to grid
                    const tempDiv = document.createElement('div');
                    tempDiv.innerHTML = cardHtml;
                    grid.appendChild(tempDiv.firstElementChild);
                };
                img.onerror = function() {
                    // Image doesn't exist - skip
                    found++;
                    // Check if all done
                    if (found === featuredDesigns.length) {
                        // If nothing found, show message
                        if (grid.children.length === 0) {
                            grid.innerHTML = `
                                <div class="no-featured">
                                    <span class="emoji">🖼️</span>
                                    Featured images not found.<br>
                                    <small style="color: #bbb;">Please add images to the thumbs folder.</small>
                                </div>
                            `;
                        }
                    }
                };
                img.src = thumbPath;
            });

            // If no images found after timeout
            setTimeout(() => {
                if (grid.children.length === 0 && grid.innerHTML.includes('Loading')) {
                    grid.innerHTML = `
                        <div class="no-featured">
                            <span class="emoji">⏳</span>
                            Loading images...<br>
                            <small style="color: #bbb;">Check your internet connection.</small>
                        </div>
                    `;
                }
            }, 5000);
        }

        // ============================================================
        // SHOW MESSAGE ON CLICK
        // ============================================================
        function showMessage(designNo) {
            alert(
                `✨ Design #${designNo}\n\n` +
                `🏫 Please login with your school account to:\n` +
                `  • View full details\n` +
                `  • Check availability\n` +
                `  • Place orders\n\n` +
                `Click "School Login" at the top right to access the complete catalog.`
            );
        }

        // ============================================================
        // MAKE FUNCTIONS GLOBAL
        // ============================================================
        window.loadFeatured = loadFeatured;
        window.showMessage = showMessage;

        // ============================================================
        // INITIALIZE
        // ============================================================
        loadFeatured();
    </script>
</body>
</html>
